# Gitea Actions build (Gitea runs .gitea/workflows and then ignores .github/workflows; GitHub does the opposite).
# Same steps as .github/workflows/build.yml, on the runner label jdk21-runner (the jdk21-runner image from
# Development/CI-Runner: Temurin 21 + Node 24), so no JDK download per run.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: jdk21-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Test and build
        run: ./gradlew test buildPlugin --console=plain
      # Gitea zips the artifact on download, so upload the unpacked plugin: the download is then the installable zip
      - name: Unpack plugin
        run: mkdir build/artifact && cd build/artifact && jar xf ../distributions/*.zip
      - uses: actions/upload-artifact@v3  # v4 needs the GitHub artifact service; Gitea speaks v3
        with:
          name: herdr-cockpit-plugin
          path: build/artifact
          if-no-files-found: error

  verify:
    # JetBrains Plugin Verifier against PhpStorm 2025.3.6.1 and 2026.2.3 (each IDE ~1 GB, kept in the cache).
    needs: build
    runs-on: jdk21-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-verify-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-verify-
      - name: Verify against PhpStorm
        run: ./gradlew verifyPlugin --console=plain

  release:
    # A tag v<version>: a Gitea release with the plugin zip (the GitHub release job doesn't run on Gitea).
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: jdk21-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Build
        run: ./gradlew buildPlugin --console=plain
      - name: Release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          [ "v$(sed -n 's/^version *= *//p' gradle.properties)" = "$TAG" ] || { echo "tag $TAG doesn't match the version in gradle.properties"; exit 1; }
          ZIP=$(ls build/distributions/*.zip)
          ID=$(curl -sSf -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}" "$API/releases" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          curl -sSf -X POST -H "Authorization: token $TOKEN" -F "attachment=@$ZIP" "$API/releases/$ID/assets?name=$(basename "$ZIP")"
