# Builds, tests and verifies the plugin on GitHub (the push mirror of the Gitea repo; Gitea runs
# .gitea/workflows/build.yml instead). A tag v<version> also publishes a GitHub release with the plugin zip.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        run: ./gradlew test buildPlugin --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: herdr-cockpit-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

  verify:
    # Runs the JetBrains Plugin Verifier against PhpStorm (downloads each IDE, ~1 GB).
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify against PhpStorm
        run: ./gradlew verifyPlugin --console=plain

  release:
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/v') && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version
        run: '[ "v$(sed -n "s/^version *= *//p" gradle.properties)" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} does not match the version in gradle.properties"; exit 1; }'
      - uses: actions/download-artifact@v8
        with:
          name: herdr-cockpit-plugin
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
